<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Milliy Sertifikat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f2f2f2;
            --card-bg: #ffffff;
            --text-color: #000000;
            --accent-color: #007aff;
            --success-color: #2b9816;
            --border-color: #d1d1d1;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 0; padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
        }

        /* HEADER */
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            background: #fff; padding: 15px 20px; z-index: 100;
            border-bottom: 2px solid #e0e0e0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .progress-info { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .progress-bar { height: 10px; background: #e0e0e0; border-radius: 20px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.3s; }

        /* CONTENT */
        #container { padding: 15px; margin-top: 90px; max-width: 600px; margin-left: auto; margin-right: auto; }

        .question-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px; margin-bottom: 12px;
            display: flex; flex-direction: column;
            border: 2px solid #e0e0e0;
            animation: fadeIn 0.3s ease forwards;
        }
        
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

        .q-num {
            font-size: 22px; font-weight: 900; color: #333;
            width: 50px; text-align: center;
        }

        /* BUTTONS (A, B, C, D...) */
        .options { display: flex; gap: 6px; justify-content: flex-end; width: 100%; flex-wrap: wrap; }

        .option-btn {
            width: 48px; height: 48px;
            border-radius: 10px; border: 2px solid var(--border-color);
            background: #f8f8f8; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 20px; cursor: pointer; color: #333;
        }
        .option-btn:active { transform: scale(0.95); background: #eee; }
        .option-btn.selected { background-color: var(--accent-color); color: white; border-color: var(--accent-color); transform: scale(1.05); }

        /* TEXT INPUTS (Yozma) */
        .text-input {
            width: 100%; padding: 14px;
            font-size: 20px; font-weight: bold;
            border: 2px solid #999; border-radius: 10px;
            text-transform: uppercase; /* Majburiy Katta Harf */
            box-sizing: border-box; text-align: center; letter-spacing: 1px;
            background: #fff; color: #000;
        }
        .text-input:focus { border-color: var(--accent-color); outline: none; background: #f0f8ff; }
        .text-input::placeholder { color: #bbb; font-size: 16px; font-weight: normal; }

        /* DOUBLE INPUT (44-savol uchun) */
        .double-input-container { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 5px; }
        .input-row { display: flex; align-items: center; gap: 10px; }
        .input-label { font-weight: 900; font-size: 20px; color: var(--accent-color); width: 30px; }

        /* FOOTER */
        .footer { position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 100; max-width: 600px; margin: 0 auto; }
        #submitBtn {
            width: 100%; padding: 18px; background: var(--success-color); color: white;
            border: none; border-radius: 16px; font-size: 20px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 15px rgba(43, 152, 22, 0.4);
        }
        #submitBtn:active { transform: scale(0.98); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="progress-info"><span id="progress-text">0%</span><span id="count-text">0/0</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div id="container"></div>

    <div class="footer">
        <button id="submitBtn" onclick="sendData()">YAKUNLASH</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#ffffff'); 
        tg.setBackgroundColor('#f2f2f2');
        tg.enableClosingConfirmation();

        // Savollar sonini olish (Default 44 ta)
        const urlParams = new URLSearchParams(window.location.search);
        const count = parseInt(urlParams.get('count')) || 44; 
        
        let answers = new Array(count).fill(null);
        const container = document.getElementById('container');

        document.getElementById('count-text').innerText = `0 / ${count}`;

        for (let i = 1; i <= count; i++) {
            let row = document.createElement('div');
            row.className = 'question-card';
            row.style.animationDelay = `${i * 0.02}s`; // Tezroq animatsiya

            let header = document.createElement('div');
            header.className = 'card-header';
            
            let num = document.createElement('div');
            num.className = 'q-num';
            num.innerText = i < 10 ? `0${i}` : i; // 01, 02 ko'rinishida
            
            let contentDiv = document.createElement('div');
            contentDiv.style.width = '100%';

            // ================== LOGIKA MARKAZI ==================

            if (i >= 1 && i <= 32) {
                // 1 dan 32 gacha: A, B, C, D
                renderOptions(i, ['A','B','C','D'], contentDiv);
            } 
            else if (i >= 33 && i <= 35) {
                // 33 dan 35 gacha: A, B, C, D, E, F
                renderOptions(i, ['A','B','C','D','E','F'], contentDiv);
            }
            else if (i >= 36 && i <= 43) {
                // 36 dan 43 gacha: YOZMA (Ochiq test)
                renderTextInput(i, contentDiv);
            }
            else if (i == 44) {
                // 44-savol: Ikkita qism (a va b)
                renderDoubleInput(i, contentDiv);
            }
            // Agar savollar 44 tadan ko'p bo'lsa, qolganlari oddiy yozma bo'ladi
            else {
                renderTextInput(i, contentDiv);
            }

            // ====================================================

            header.appendChild(num);
            header.appendChild(contentDiv);
            row.appendChild(header);
            container.appendChild(row);
        }

        // --- FUNKSIYALAR ---

        // 1. Variantli tugmalar chizish
        function renderOptions(idx, variants, parent) {
            let optsDiv = document.createElement('div');
            optsDiv.className = 'options';
            variants.forEach(variant => {
                let btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = variant;
                btn.onclick = () => {
                    if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                    Array.from(optsDiv.children).forEach(c => c.classList.remove('selected'));
                    btn.classList.add('selected');
                    answers[idx-1] = variant; 
                    updateProgress();
                };
                optsDiv.appendChild(btn);
            });
            parent.appendChild(optsDiv);
        }

        // 2. Yozma (Input) chizish
        function renderTextInput(idx, parent) {
            let input = document.createElement('input');
            input.type = 'text';
            input.className = 'text-input';
            input.placeholder = 'JAVOB...';
            // Fokus bo'lganda klaviatura ochilishi uchun
            input.inputMode = 'text'; 
            
            input.oninput = (e) => {
                // Avtomatik KATTA HARF ga o'tkazish
                let val = e.target.value.toUpperCase().trim();
                e.target.value = val; 
                
                answers[idx-1] = val.length > 0 ? val : null;
                updateProgress();
            };
            parent.appendChild(input);
        }

        // 3. Ikkita input (44-savol)
        function renderDoubleInput(idx, parent) {
            let wrapper = document.createElement('div');
            wrapper.className = 'double-input-container';
            
            // a) qismi
            let rowA = document.createElement('div'); rowA.className = 'input-row';
            let labelA = document.createElement('span'); labelA.className = 'input-label'; labelA.innerText = 'a';
            let inputA = document.createElement('input'); 
            inputA.className = 'text-input'; inputA.placeholder = 'JAVOB A...'; inputA.id = `q${idx}_a`;
            rowA.appendChild(labelA); rowA.appendChild(inputA);

            // b) qismi
            let rowB = document.createElement('div'); rowB.className = 'input-row';
            let labelB = document.createElement('span'); labelB.className = 'input-label'; labelB.innerText = 'b';
            let inputB = document.createElement('input'); 
            inputB.className = 'text-input'; inputB.placeholder = 'JAVOB B...'; inputB.id = `q${idx}_b`;
            rowB.appendChild(labelB); rowB.appendChild(inputB);

            wrapper.appendChild(rowA);
            wrapper.appendChild(rowB);
            parent.appendChild(wrapper);

            const updateDouble = () => {
                let valA = document.getElementById(`q${idx}_a`).value.toUpperCase().trim();
                let valB = document.getElementById(`q${idx}_b`).value.toUpperCase().trim();
                
                // Inputlarga yozilayotganda darhol katta harf qilish
                document.getElementById(`q${idx}_a`).value = valA;
                document.getElementById(`q${idx}_b`).value = valB;

                if (valA && valB) {
                    answers[idx-1] = `a)${valA} b)${valB}`;
                } else {
                    answers[idx-1] = null;
                }
                updateProgress();
            };

            inputA.oninput = updateDouble;
            inputB.oninput = updateDouble;
        }

        function updateProgress() {
            let solved = answers.filter(a => a !== null).length;
            let percent = Math.round((solved / count) * 100);
            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${percent}%`;
            document.getElementById('count-text').innerText = `${solved} / ${count}`;
        }

        function sendData() {
            let solved = answers.filter(a => a !== null).length;
            
            if (solved < count) {
                tg.showPopup({
                    title: 'Diqqat',
                    message: `Siz ${count} ta savoldan faqat ${solved} tasini yozdingiz. Yakunlayverasizmi?`,
                    buttons: [{id: 'cancel', type: 'cancel'}, {id: 'ok', type: 'destructive', text: 'HA'}]
                }, function(btnId) {
                    if (btnId === 'ok') {
                        // Bo'sh qolgan joylarga "X" qo'yib yuboramiz
                        let finalData = answers.map(a => a ? a : "X");
                        tg.sendData(JSON.stringify(finalData));
                    }
                });
            } else {
                tg.sendData(JSON.stringify(answers));
            }
        }
    </script>
</body>
</html>
