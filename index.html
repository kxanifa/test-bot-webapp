<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Professional Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- RANG SOZLAMALARI (O'zgarmas OQ fon) --- */
        :root {
            --bg-color: #f0f2f5;       /* Orqa fon: Och kulrang */
            --card-bg: #ffffff;        /* Kartochka: Oq */
            --text-color: #000000;     /* Yozuv: Qora */
            --hint-color: #888888;
            --accent-color: #007aff;   /* Chiroyli ko'k */
            --accent-text: #ffffff;
            --border-color: #e4e4e4;
            --success-color: #2b9816;
            --shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- HEADER (Kompakt) --- */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            z-index: 100;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        .progress-bar {
            height: 5px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* --- CONTENT (Zichlashtirilgan) --- */
        #container {
            padding: 12px;
            margin-top: 50px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 10px 12px;  /* Ichki masofa kamaytirildi */
            margin-bottom: 8px;   /* Kartalar orasi yaqinlashtirildi */
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
            transform: translateY(5px);
        }

        .q-num {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            width: 35px; /* Raqam uchun joy kichraytirildi */
        }

        .options {
            display: flex;
            gap: 6px; /* Tugmalar orasi yaqinlashtirildi */
        }

        .option-btn {
            width: 36px;  /* Tugma kichraytirildi */
            height: 36px;
            border-radius: 10px; /* Biroz to'rtburchakroq */
            border: 1px solid var(--border-color);
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-color);
        }

        /* Bosilgandagi effekt */
        .option-btn:active {
            transform: scale(0.95);
        }

        /* Tanlangan variant */
        .option-btn.selected {
            background-color: var(--accent-color);
            color: var(--accent-text);
            border-color: var(--accent-color);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
        }

        /* --- FOOTER BUTTON --- */
        .footer {
            position: fixed;
            bottom: 15px; left: 15px; right: 15px;
            z-index: 100;
            max-width: 500px;
            margin: 0 auto;
            left: 0; right: 0;
            padding: 0 15px;
        }

        #submitBtn {
            width: 100%;
            padding: 14px;
            background: var(--success-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(43, 152, 22, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #submitBtn:active { transform: scale(0.98); }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="progress-info">
            <span id="progress-text">Jarayon: 0%</span>
            <span id="count-text">0 / 0</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div id="container"></div>

    <div class="footer">
        <button id="submitBtn" onclick="sendData()">
            <span>YAKUNLASH</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        // Rangni majburan oq qilamiz (Telefoni qora rejimda bo'lsa ham)
        tg.setHeaderColor('#ffffff'); 
        tg.setBackgroundColor('#f0f2f5');
        
        tg.enableClosingConfirmation();

        // URL dan ma'lumot olish
        const urlParams = new URLSearchParams(window.location.search);
        const count = parseInt(urlParams.get('count')) || 10;
        
        let answers = new Array(count).fill(null);
        const container = document.getElementById('container');
        const variants = ['A', 'B', 'C', 'D'];

        document.getElementById('count-text').innerText = `0 / ${count}`;

        for (let i = 1; i <= count; i++) {
            let row = document.createElement('div');
            row.className = 'question-card';
            row.style.animationDelay = `${i * 0.02}s`; // Tezroq animatsiya

            let num = document.createElement('div');
            num.className = 'q-num';
            num.innerText = i < 10 ? `0${i}` : i;
            
            let optsDiv = document.createElement('div');
            optsDiv.className = 'options';

            variants.forEach(variant => {
                let btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = variant;
                
                btn.onclick = () => {
                    if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); // Yengil vibratsiya

                    Array.from(optsDiv.children).forEach(c => c.classList.remove('selected'));
                    btn.classList.add('selected');
                    answers[i-1] = variant.toLowerCase();
                    updateProgress();
                };
                optsDiv.appendChild(btn);
            });

            row.appendChild(num);
            row.appendChild(optsDiv);
            container.appendChild(row);
        }

        function updateProgress() {
            let solved = answers.filter(a => a !== null).length;
            let percent = Math.round((solved / count) * 100);
            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `Jarayon: ${percent}%`;
            document.getElementById('count-text').innerText = `${solved} / ${count}`;
        }

        function sendData() {
            let solved = answers.filter(a => a !== null).length;
            if (solved < count) {
                tg.showPopup({
                    title: 'Diqqat!',
                    message: `Siz ${count} ta savoldan faqat ${solved} tasini belgiladingiz. Baribir yakunlaysizmi?`,
                    buttons: [{id: 'cancel', type: 'cancel'}, {id: 'ok', type: 'destructive', text: 'Ha, yakunlash'}]
                }, function(btnId) {
                    if (btnId === 'ok') tg.sendData(JSON.stringify(answers));
                });
            } else {
                tg.sendData(JSON.stringify(answers));
            }
        }
    </script>
</body>
</html>
