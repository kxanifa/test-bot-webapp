<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bot WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 20px; }
        .question-row { display: flex; align-items: center; margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #eee; }
        .q-num { width: 30px; font-weight: bold; }
        .options { display: flex; gap: 10px; flex-grow: 1; justify-content: space-around; }
        .option { 
            width: 35px; height: 35px; border-radius: 50%; border: 2px solid #3498db; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold;
        }
        .option.selected { background-color: #3498db; color: white; }
        button#submit-btn, button#generate-btn { 
            width: 100%; padding: 15px; background-color: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 20px; 
        }
        input#q-count-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        .hidden { display: none; }
    </style>
</head>
<body>
    <h3 id="title">Testni yechish</h3>

    <div id="admin-controls" class="hidden">
        <label>Savollar soni:</label>
        <input type="number" id="q-count-input" placeholder="Masalan: 30" min="1" max="100">
        <button id="generate-btn">Yaratish</button>
    </div>

    <div id="questions-container"></div>
    <button id="submit-btn" class="hidden">YUBORISH</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode'); // 'admin' yoki 'user'
        const countParam = urlParams.get('count'); // User uchun savollar soni
        
        const container = document.getElementById('questions-container');
        const submitBtn = document.getElementById('submit-btn');
        const adminControls = document.getElementById('admin-controls');
        const title = document.getElementById('title');
        
        let answers = {};
        let totalQuestions = 0;

        // Rejimni aniqlash
        if (mode === 'admin') {
            title.innerText = "To'g'ri javoblarni belgilang";
            adminControls.classList.remove('hidden');
            
            document.getElementById('generate-btn').addEventListener('click', () => {
                const val = document.getElementById('q-count-input').value;
                if(val > 0) {
                    totalQuestions = parseInt(val);
                    renderQuestions(totalQuestions);
                    adminControls.classList.add('hidden'); // Inputni yashirish
                    submitBtn.classList.remove('hidden');
                }
            });
        } else {
            // User rejimi
            title.innerText = "Javoblarni belgilang";
            totalQuestions = parseInt(countParam) || 30; // Default 30
            renderQuestions(totalQuestions);
            submitBtn.classList.remove('hidden');
        }

        function renderQuestions(n) {
            container.innerHTML = '';
            for (let i = 1; i <= n; i++) {
                let row = document.createElement('div');
                row.className = 'question-row';
                
                let num = document.createElement('div');
                num.className = 'q-num';
                num.innerText = i + ".";
                
                let optsDiv = document.createElement('div');
                optsDiv.className = 'options';
                
                ['A', 'B', 'C', 'D'].forEach(opt => {
                    let circle = document.createElement('div');
                    circle.className = 'option';
                    circle.innerText = opt;
                    circle.onclick = () => selectOption(i, opt, circle);
                    optsDiv.appendChild(circle);
                });
                
                row.appendChild(num);
                row.appendChild(optsDiv);
                container.appendChild(row);
                answers[i] = null; // Boshlang'ich qiymat
            }
        }

        function selectOption(qNum, optValue, element) {
            // Hozirgi qatordagi barcha optionlardan 'selected' ni olib tashlash
            let siblings = element.parentElement.children;
            for (let sib of siblings) {
                sib.classList.remove('selected');
            }
            // Tanlanganni belgilash
            element.classList.add('selected');
            answers[qNum] = optValue;
        }

        submitBtn.addEventListener('click', () => {
            // Javoblarni list shakliga keltirish [A, B, C...]
            let resultList = [];
            for(let i=1; i<=totalQuestions; i++){
                resultList.push(answers[i] || "X"); // Belgilanmagan bo'lsa X
            }
            tg.sendData(JSON.stringify(resultList));
        });
    </script>
</body>
</html>
